# This is a Liquibase properties configuration file that defines database connection and changelog settings
# changeLogFile: Specifies the master changelog file location that contains all database changes
# driver: The JDBC driver class used to connect to the database
# url: The JDBC URL for connecting to the database
# username: Database username pulled from environment variable DB_USERNAME for security
changeLogFile=db/changelog/db.changelog-master.yaml
driver=org.postgresql.Driver
url=jdbc:postgresql://localhost:5432/restr_transform_out_pp
username=postgres